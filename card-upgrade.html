<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>卡片升星查詢 - RoRDB</title>
  <style>
    /* 獨立保留該頁面的客製化樣式 */
    .upgrade-tool-container {
      background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border-radius: 12px; padding: 30px;
      max-width: 500px; margin: 0 auto; box-shadow: 0 1px 3px 0 rgba(60,64,67,0.3); border: 1px solid #dadce0;
    }
    .upgrade-tool-container h1 { font-size: 22px; text-align: center; color: #1a73e8; margin-bottom: 20px; font-weight: 500; }
    .upgrade-tool-container label { display: block; font-weight: bold; margin: 12px 0 5px; color: #3c4043; font-size: 0.95rem; }
    .upgrade-tool-container select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; margin-bottom: 10px; min-height: 41px; box-sizing: border-box; }
    
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }

    .button-container { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
    .upgrade-tool-container button { background-color: #1a73e8; color: white; font-weight: bold; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; transition: background 0.2s; }
    .upgrade-tool-container button:hover { background-color: #1557b0; }
    .result { margin-top: 20px; background: #e8f0fe; border: 1px solid #d2e3fc; border-radius: 8px; padding: 15px; font-size: 16px; color: #1a73e8; min-height: 54px; line-height: 1.5; font-weight: 500;}
    .polly-animated { width: 48px; height: 48px; animation: bounce 1.2s infinite; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  </style>
</head>
<body>
  <main>
    <div class="upgrade-tool-container">
      <h1>卡片升星機率查詢</h1>

      <label>原卡</label>
      <div class="row">
        <div style="flex: 1;">
          <select id="oCategory"></select>
        </div>
        <div style="flex: 2;">
          <select id="original"></select>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="oStar">原卡星數</label>
          <select id="oStar">
            <option value="1">1 星</option><option value="2">2 星</option><option value="3">3 星</option><option value="4">4 星</option>
          </select>
        </div>
        <div>
          <label for="oTier">原卡階級</label>
          <select id="oTier">
            <option value="1">I 階</option>
            <option value="2">II 階</option>
          </select>
        </div>
      </div>

      <label>材料卡</label>
      <div class="row">
        <div style="flex: 1;">
          <select id="mCategory"></select>
        </div>
        <div style="flex: 2;">
          <select id="material"></select>
        </div>
      </div>

      <label for="mStar">材料星數</label>
      <select id="mStar">
        <option value="1">1 星</option><option value="2">2 星</option><option value="3">3 星</option><option value="4">4 星</option><option value="5">5 星</option>
      </select>

      <div class="button-container">
        <button id="checkBtn">查詢升星機率</button>
        <img src="/images/card-upgrade_img_1.png" alt="波利" class="polly-animated" onerror="this.style.display='none'" />
      </div>

      <div id="result" class="result">歡迎使用！</div>
    </div>
  </main>

  <script>
    const API_BASE = "https://script.google.com/macros/s/AKfycbw5xG6Xf7QZr_1pCF_hP4UF_c2OFtLQQdTcOWfL_6XbtiLx9iWas77CP0-OUgcmbDta/exec";

    let cardMap = {};

    function getMultiplier(star) {
      switch (parseInt(star)) {
        case 1: return 1;
        case 2: return 2;
        case 3: return 2 * 19 / 9;
        case 4: return 2 * 19 * 18 / 9 / 8;
        case 5: return 2 * 19 * 18 * 17 / 9 / 8 / 7;
        default: return null;
      }
    }

    function updateUI() {
      if (Object.keys(cardMap).length === 0) return;
      
      const categories = [...new Set(Object.values(cardMap).map(c => c.category).filter(Boolean))];
      
      const oCat = document.getElementById("oCategory");
      const mCat = document.getElementById("mCategory");
      const curOCat = oCat.value, curMCat = mCat.value;
      
      const catHtml = categories.map(c => `<option value="${c}">${c}</option>`).join('');
      oCat.innerHTML = catHtml;
      mCat.innerHTML = catHtml;
      
      if (curOCat && categories.includes(curOCat)) oCat.value = curOCat;
      if (curMCat && categories.includes(curMCat)) mCat.value = curMCat;

      updateCardDropdown("oCategory", "original");
      updateCardDropdown("mCategory", "material");
    }

    function updateCardDropdown(catId, cardId) {
      const cat = document.getElementById(catId).value;
      const cardSel = document.getElementById(cardId);
      const curCard = cardSel.value;
      
      const cardsInCategory = Object.entries(cardMap).filter(([k, v]) => v.category === cat);
      const html = cardsInCategory.map(([k, v]) => `<option value="${k}">${v.displayName}</option>`).join('');
      cardSel.innerHTML = html;
      
      if (curCard && cardsInCategory.some(([k]) => k === curCard)) {
        cardSel.value = curCard;
      }
    }

    document.getElementById("oCategory").addEventListener("change", () => updateCardDropdown("oCategory", "original"));
    document.getElementById("mCategory").addEventListener("change", () => updateCardDropdown("mCategory", "material"));

    async function initData() {
      // 1. 靜默載入本地 JSON 作為基礎資料 (非常快)
      try {
        const localRes = await fetch(`/data/cards.json?t=${Date.now()}`);
        const localData = await localRes.json();
        if (localData) {
          cardMap = localData;
          updateUI();
        }
      } catch (e) { console.warn("讀取本地預載資料失敗", e); }

      // 2. 背景即時向 Google 取得最新資料
      try {
        const res = await fetch(`${API_BASE}?action=getCardDataV2&t=${Date.now()}`);
        const data = await res.json();
        if (data.map) {
          cardMap = data.map;
          updateUI();
          console.log("背景即時同步 Google 資料完成");
        }
      } catch (e) { console.warn("即時同步失敗，維持使用本地資料", e); }
    }

    function queryLocalRate() {
      const fromName = document.getElementById("original").value;
      const fromStar = parseInt(document.getElementById("oStar").value);
      const tierDivisor = parseInt(document.getElementById("oTier").value); 
      
      const toName = document.getElementById("material").value;
      const toStar = parseInt(document.getElementById("mStar").value);

      const fromWeight = cardMap[fromName]?.weight;
      const toWeight = cardMap[toName]?.weight;
      const fromBefore = getMultiplier(fromStar);
      const fromAfter = getMultiplier(fromStar + 1);
      const m = getMultiplier(toStar);
      const resultDiv = document.getElementById("result");

      if (!fromWeight || !toWeight || !fromBefore || !fromAfter || !m) {
        resultDiv.innerHTML = `❌ 資料載入中...`;
        return;
      }

      const denominator = fromWeight * (fromAfter - fromBefore);
      if (denominator === 0) {
        resultDiv.innerHTML = `❌ 分母為 0，無法計算`;
        return;
      }

      const rawRate = (toWeight * m) / denominator;
      
      let sameRateNum = rawRate * 100;
      let diffRateNum = (rawRate / 5 / tierDivisor) * 100;

      if (sameRateNum > 100) sameRateNum = 100;
      if (diffRateNum > 100) diffRateNum = 100;

      const sameNameRate = sameRateNum.toFixed(4);
      const diffNameRate = diffRateNum.toFixed(4);

      if (fromName === toName) {
        resultDiv.innerHTML = `同名卡片成功率：${sameNameRate}%<br/>不同名卡片成功率：${diffNameRate}%`;
      } else {
        resultDiv.innerHTML = `不同名卡片成功率：${diffNameRate}%`;
      }
    }

    document.getElementById("checkBtn").onclick = queryLocalRate;
    initData();
  </script>
  <script type="module" src="/main.js"></script>
</body>
</html>
